<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL}}">
<meta name="robots" content="{{ROBOTS}}">
<meta name="theme-color" content="#F2F3F1">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Worth Owning">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
{{SCHEMA}}
{{ANALYTICS}}<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
{{CSS}}</style>
</head>
<body>

<header class="top wrap">
  <a class="wordmark" href="/">Worth Owning</a>
  <nav aria-label="Sections">
    <a href="/#picks">All picks</a>
    <a href="/#criteria">Criteria</a>
  </nav>
</header>

<main class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb">{{CRUMBS}}</nav>
  <article class="pick">
    {{ART}}
    <div>
      <p class="meta">{{BRAND}}</p>
      <h1>{{NAME}}</h1>
      {{CHIPS}}
      {{WHY}}
      {{BUY}}
    </div>
  </article>

  {{MORE}}
</main>

{{FOOTER}}
</body>
</html>
